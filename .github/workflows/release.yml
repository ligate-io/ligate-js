name: Release

# Triggered on `v*` tag pushes. Builds the SDK and publishes to npm
# as `@ligate-labs/sdk` with sigstore provenance attestation.
#
# Tagging convention:
#   - Pre-devnet RC:  `v0.0.X-rc.N` and `v0.0.X` (legacy stable, kept
#                     on `latest` until the post-soak cut).
#   - At devnet:      `v0.1.0-devnet` (paired with the chain's
#                     `v0.1.0-devnet`). Lands on the `rc` dist-tag so
#                     `npm install @ligate-labs/sdk` (no tag) stays on
#                     the wire-format-stable line; devnet users opt in
#                     via `@rc` or by pinning `@0.1.0-devnet`.
#   - Post-soak:      `v0.1.0` (no suffix) once a 24–48h public soak
#                     locks the chain's wire format. Promotes to the
#                     `latest` dist-tag; minor-version SemVer applies
#                     inside `0.1.x` from that point.
#
# Prereqs (operator-side, one-time):
#   1. Register `@ligate-labs` org on npm under hello@ligate.io.
#   2. Generate a granular automation token scoped to `@ligate-labs`
#      / publish-only. Add as the `NPM_TOKEN` repo secret.
#   3. Enable OIDC in npm org settings so `--provenance` works without
#      `id-token: write` permission flips per workflow.
#
# Workflow_dispatch runs the build matrix as a dry-run (typecheck +
# test + build, no publish), useful for verifying the pipeline before
# tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # `contents: write` is required by `softprops/action-gh-release` to
  # create the matching GitHub Release on tag push.
  contents: write
  # `id-token: write` is required for sigstore provenance (`npm publish
  # --provenance`).
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Need full history for the changelog excerpt step.
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          # Tag push: use the tag (e.g. v0.0.1) stripped of leading 'v'.
          # workflow_dispatch: derive from package.json so dry-runs are
          # repeatable and obviously not real publishes.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-dryrun-${{ github.sha }}"
            VERSION="${VERSION:0:35}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # `setup-node` writes an `.npmrc` that points npm publish at
          # the public registry and authenticates via NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package.json version matches tag (tag pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [[ "${PKG_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match tag (${TAG_VERSION}). Bump package.json before tagging."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Publish settings live in package.json's `publishConfig` block
      # (already set to `access: public`). The `--provenance` flag adds
      # an OIDC attestation that consumers can verify with `npm audit
      # signatures`. The `--tag` flag isolates pre-release versions
      # under the `rc` dist-tag so `npm install @ligate/sdk` (no version)
      # only resolves to stable releases.
      - name: Publish to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.ref_name }}"
          # Dist-tag selection: ONLY `-rc.` tags go to the `rc`
          # channel (true release candidates). `-devnet` / `-testnet`
          # tags are "current public network" releases -- pinned,
          # canonical for that network's lifetime -- and ship on
          # `latest` so `npm install @ligate-labs/sdk` resolves to the
          # version that works against the current public network.
          # Full mainnet (`vX.Y.Z` plain) is also `latest`.
          if [[ "${TAG_NAME}" == *-rc.* ]]; then
            DIST_TAG=rc
          else
            DIST_TAG=latest
          fi
          echo "Publishing under dist-tag: ${DIST_TAG}"
          pnpm publish --no-git-checks --access public --provenance --tag "${DIST_TAG}"

      # Extract the matching version section out of CHANGELOG.md so the
      # GitHub Release body shows the same notes that ship in the repo.
      # Emits everything between `## [X.Y.Z] - ...` and the next
      # top-level `## [` section, then prepends the npm install line.
      # If CHANGELOG.md is missing or doesn't have a section for this
      # version, falls back to the one-liner so the release step still
      # creates *something* useful.
      - name: Build release notes from CHANGELOG.md
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          {
            echo "\`\`\`bash"
            echo "npm install @ligate-labs/sdk@${VERSION}"
            echo "\`\`\`"
            echo ""
          } > "${NOTES_FILE}"

          if [[ -f CHANGELOG.md ]]; then
            CHANGELOG_BODY="$(awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md)"
            if [[ -n "${CHANGELOG_BODY}" ]]; then
              echo "${CHANGELOG_BODY}" >> "${NOTES_FILE}"
            else
              echo "_See [CHANGELOG.md](https://github.com/ligate-io/ligate-js/blob/main/CHANGELOG.md) for the full changeset._" >> "${NOTES_FILE}"
            fi
          else
            echo "_See [CHANGELOG.md](https://github.com/ligate-io/ligate-js/blob/main/CHANGELOG.md) for the full changeset._" >> "${NOTES_FILE}"
          fi

          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          # Treat ONLY tags containing `-rc.` as pre-release (true
          # release candidates). `-devnet` / `-testnet` tags are
          # "current public network" releases and ship as normal
          # releases (matching the npm dist-tag logic above).
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
